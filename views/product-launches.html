{{ define "content" }}
<section class="container mx-auto flex flex-col">
  <ol
    class="text-muted-foreground flex flex-wrap items-center gap-1.5 text-sm break-words sm:gap-2.5"
  >
    <li class="inline-flex items-center gap-1.5">
      <a href="/my/products" class="hover:text-foreground transition-colors"
        >Мои продукты</a
      >
    </li>
    <li class="text-gray-400">/</li>
    <li class="inline-flex items-center gap-1.5">
      <a
        href="/products/{{ .Product.Slug }}"
        target="_blank"
        class="hover:text-foreground transition-colors"
      >
        {{ .Product.Name }}
      </a>
    </li>
    <li class="text-gray-400">/</li>
    <li class="inline-flex items-center gap-1.5">
      <span class="text-foreground font-normal">Запуски</span>
    </li>
  </ol>
  {{if .Launches}}
  <div class="flex flex-col justify-start gap-5 mt-8 max-w-xl">
    {{ range .Launches }} {{ template "launch-edit-card" (dict "Launch" .
    "token" $.token) }} {{ end }}
  </div>
  {{else}}
  <div class="bg-white p-4 text-center">
    <p class="text-gray-900 text-xl">Пока нет запусков</p>
    <a
      class="btn btn-primary rounded-full bg-indigo-600 text-white mt-3"
      href="/products/{{ .Product.ID }}/new-launch"
    >
      Создать запуск
    </a>
  </div>
  {{end}}
</section>
{{ end }}
