{{ define "members-tab" }}
<div class="flex flex-col gap-4">
  {{ if .Members }}
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    {{ range .Members }}
    <div class="bg-white p-4 rounded-lg border text-center">
      <p class="font-semibold text-gray-800">{{ .Name }}</p>
      <p class="text-sm text-gray-500">{{ .Role }}</p>
    </div>
    {{ end }}
  </div>
  {{ else }}
  <div class="bg-white p-6 text-center rounded-2xl border">
    <div
      class="mx-auto w-12 h-12 mb-4 flex items-center justify-center bg-purple-100 text-purple-600 rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
    </div>
    <h3 class="text-xl font-bold text-gray-900">Нет участников</h3>
    <p class="text-gray-500 mt-1">В этом продукте пока нет участников.</p>
  </div>
  {{ end }}
</div>
{{ end }}
