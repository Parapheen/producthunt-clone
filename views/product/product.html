{{ define "content" }}
<section class="container mx-auto">
  <div class="bg-white p-8 rounded-2xl border border-gray-200 mb-8">
    <div class="flex flex-col md:flex-row items-center gap-8">
      <div class="flex-shrink-0">
        <img class="w-32 h-32 rounded-lg object-cover ring-4 ring-indigo-100"
          src="https://placehold.co/128x128/e0e7ff/4338ca?text=P" alt="{{ .Product.Name }}" />
      </div>
      <div class="flex-grow text-center md:text-left">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">
          {{ .Product.Name }}
        </h1>
        <p class="text-gray-700 mb-4">A great tagline for an amazing product.</p>
        <a href="{{ .Product.URL }}" target="_blank" class="text-indigo-600 hover:underline break-all">{{ .Product.URL
          }}</a>
      </div>
    </div>
  </div>

  <div class="mb-4 border-b border-gray-200">
    <ul class="flex flex-wrap -mb-px text-sm font-medium text-center" id="product-tabs">
      <li class="mr-2">
        <button hx-get="/api/products/{{.Product.ID}}/launches" hx-target="#tab-content" hx-push-url="true"
          class="tab-button inline-block p-4 border-b-2 rounded-t-lg text-indigo-600 border-indigo-600"
          aria-current="page">
          Запуски
          <span class="inline-block ml-2 px-2 py-0.5 text-xs font-medium text-indigo-800 bg-indigo-100 rounded-full">
            {{ len .Launches }}
          </span>
        </button>
      </li>
      <li class="mr-2">
        <button hx-get="/api/products/{{.Product.ID}}/members" hx-target="#tab-content" hx-push-url="true"
          class="tab-button inline-block p-4 border-b-2 rounded-t-lg border-transparent hover:text-gray-600 hover:border-gray-300">
          Участники
          <span class="inline-block ml-2 px-2 py-0.5 text-xs font-medium text-indigo-800 bg-indigo-100 rounded-full">
            {{ len .Product.Members }}
          </span>
        </button>
      </li>
    </ul>
  </div>

  <div id="tab-content">
    {{ template "launches-tab" . }}
  </div>

</section>

<script>
  // This script handles the "active" state styling for the tabs.
  document.addEventListener('htmx:beforeRequest', function (evt) {
    const tabContainer = document.getElementById('product-tabs');
    if (tabContainer && tabContainer.contains(evt.detail.elt)) {
      const tabs = tabContainer.querySelectorAll('.tab-button');

      tabs.forEach(tab => {
        tab.classList.remove('text-indigo-600', 'border-indigo-600');
        tab.classList.add('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
        tab.removeAttribute('aria-current');
      });

      const clickedTab = evt.detail.elt;
      clickedTab.classList.add('text-indigo-600', 'border-indigo-600');
      clickedTab.classList.remove('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
      clickedTab.setAttribute('aria-current', 'page');
    }
  });
</script>

{{ end }}
