{{ define "content" }}
<section class="container max-w-4xl mx-auto">
  <div class="bg-white p-8 rounded-2xl border border-gray-200 mb-8">
    <div class="flex flex-col md:flex-row items-center gap-8">
      <div class="flex-shrink-0">
        <img class="w-32 h-32 rounded-lg object-cover ring-4 ring-indigo-100"
          src="https://placehold.co/128x128/e0e7ff/4338ca?text=P" alt="{{ .Product.Name }}" />
      </div>
      <div class="flex-grow flex flex-col gap-5">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">
            {{ .Product.Name }}
          </h1>
          <p class="text-gray-700">{{ .Product.Tagline }}</p>
          <a href="{{ .Product.URL }}" target="_blank" class="text-indigo-600 hover:underline break-all">{{ .Product.URL
            }}</a>
        </div>
        <div class="flex gap-2">
          {{ range .Product.Categories }}
          <span class="text-sm bg-gray-100 text-gray-600 rounded-md px-2 py-1">
            {{ .Name }}
          </span>
          {{ end }}
        </div>
      </div>
    </div>
  </div>

  <div class="mb-4 border-b border-gray-200">
    <ul class="flex flex-wrap -mb-px text-sm font-medium text-center" id="product-tabs">
      <li class="mr-2">
        <button hx-get="/products/{{.Product.Slug}}/launches" hx-target="#tab-content" hx-push-url="true"
          class="tab-button inline-flex items-center p-4 border-b-2 rounded-t-lg">
          Запуски
          <span class="inline-block ml-2 px-2 py-0.5 text-xs font-medium text-gray-800 bg-gray-200 rounded-full">
            {{ len .Launches }}
          </span>
        </button>
      </li>
      <li class="mr-2">
        <button hx-get="/products/{{.Product.Slug}}/members" hx-target="#tab-content" hx-push-url="true"
          class="tab-button inline-flex items-center p-4 border-b-2 rounded-t-lg">
          Участники
          <span class="inline-block ml-2 px-2 py-0.5 text-xs font-medium text-gray-800 bg-gray-200 rounded-full">
            {{ len .Product.Members }}
          </span>
        </button>
      </li>
    </ul>
  </div>

  <div id="tab-content">
    {{ if eq .ActiveTab "launches" }}
    {{ template "launches-tab" . }}
    {{ else if eq .ActiveTab "members" }}
    {{ template "members-tab" . }}
    {{ end }}
  </div>

</section>

<script>
  function syncActiveTabState() {
    const currentPath = window.location.pathname;
    const tabContainer = document.getElementById('product-tabs');
    if (!tabContainer) return;

    const tabs = tabContainer.querySelectorAll('.tab-button');
    let activeTabFound = false;

    tabs.forEach(tab => {
      const tabPath = tab.getAttribute('hx-get');
      // Check if the browser's path ends with the tab's hx-get path
      const isActive = tabPath && currentPath.endsWith(tabPath);

      // Toggle classes for the tab button
      tab.classList.toggle('text-indigo-600', isActive);
      tab.classList.toggle('border-indigo-600', isActive);
      tab.classList.toggle('border-transparent', !isActive);
      tab.classList.toggle('hover:text-gray-600', !isActive);
      tab.classList.toggle('hover:border-gray-300', !isActive);

      // Toggle classes for the counter span inside the button
      const counter = tab.querySelector('span');
      if (counter) {
        counter.classList.toggle('bg-indigo-100', isActive);
        counter.classList.toggle('text-indigo-800', isActive);
        counter.classList.toggle('bg-gray-200', !isActive);
        counter.classList.toggle('text-gray-800', !isActive);
      }

      if (isActive) {
        tab.setAttribute('aria-current', 'page');
        activeTabFound = true;
      } else {
        tab.removeAttribute('aria-current');
      }
    });

    // If no tab matches the URL (e.g., on the base product page), default to the first tab.
    if (!activeTabFound && tabs.length > 0) {
      const firstTab = tabs[0];
      firstTab.classList.add('text-indigo-600', 'border-indigo-600');
      firstTab.classList.remove('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
      firstTab.setAttribute('aria-current', 'page');

      const firstCounter = firstTab.querySelector('span');
      if (firstCounter) {
        firstCounter.classList.add('bg-indigo-100', 'text-indigo-800');
        firstCounter.classList.remove('bg-gray-200', 'text-gray-800');
      }
    }
  }

  // Run when the page first loads
  document.addEventListener('DOMContentLoaded', syncActiveTabState);

  // Run after HTMX swaps content and the URL has been updated
  document.body.addEventListener('htmx:pushedIntoHistory', syncActiveTabState);

  // Run when using the browser's back/forward buttons
  window.addEventListener('popstate', syncActiveTabState);
</script>

{{ end }}
