<!DOCTYPE html>
<html lang="ru">
{{ template "head" . }}

<body>
  {{ template "header" . }}
  <div class="container mx-auto mt-16">
    <div class="bg-white p-8 rounded-2xl border border-gray-200 mb-8">
      <div class="flex flex-col md:flex-row items-center gap-8">
        <div class="flex-shrink-0">
          <img class="w-32 h-32 rounded-lg object-cover ring-4 ring-indigo-100"
            src="https://placehold.co/128x128/e0e7ff/4338ca?text=P" alt="{{ .Product.Name }}" />
        </div>
        <div class="flex-grow text-center md:text-left">
          <h1 class="text-3xl font-bold text-gray-900 mb-2">
            {{ .Product.Name }}
          </h1>
          <p class="text-gray-700 mb-4">tagline</p>
          <a href="{{ .Product.URL }}" target="_blank" class="text-indigo-600 hover:underline break-all">{{ .Product.URL
            }}</a>
        </div>
      </div>
      <div class="flex flex-wrap gap-6">
        {{ range .Product.Members }}
        <div class="flex items-center gap-3">
          <img class="w-10 h-10 rounded-full object-cover ring-2
            ring-indigo-200" src="{{
            " https://placehold.co/80x80/e0e7ff/4338ca?text=U" }}">
          <div>
            <div class="text-xs text-gray-500">{{ .Role }}</div>
          </div>
        </div>
        {{ end }}
      </div>
    </div>

    <div class="flex flex-col gap-4 mb-8">
      {{ if .Launches }}
      <h2 class="text-xl font-bold text-gray-900">Запуски</h2>
      <div class="flex flex-col max-w-2xl gap-4">
        {{ range .Launches }}
        {{ template "launch-card" . }}
        {{ end }}
      </div>
      {{ else }}
      <div class="bg-white p-4 text-center rounded-2xl shadow-sm">
        <div class="mx-auto w-10 h-10 mb-2 flex items-center justify-center bg-blue-100 text-blue-600 rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-briefcase-business-icon lucide-briefcase-business">
            <path d="M12 12h.01" />
            <path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
            <path d="M22 13a18.15 18.15 0 0 1-20 0" />
            <rect width="20" height="14" x="2" y="6" rx="2" />
          </svg>
        </div>
        <p class="text-2xl font-bold text-gray-900">Нет запусков</p>
      </div>
      {{ end }}
    </div>
</body>

</html>
