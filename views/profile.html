<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ph clone</title>

	<script src="/assets/js/htmx.min.js"></script>
	<script src="https://unpkg.com/hyperscript.org@0.9.14"></script>
	<script src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-with-polyfills-latest.js"></script>
	<script
		src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-token-with-polyfills-latest.js"></script>
	<link href="/assets/css/output.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.2.4/dist/basecoat.cdn.min.css">
	<script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.2/dist/js/all.min.js" defer></script>
</head>

<body>
	{{ template "header" . }}

	<div class="container mx-auto max-w-lg mt-14 flex-col gap-8">
		<div class="card">
			<header>
				<h2 class="text-2xl font-bold">
					{{ .User.Name }}
				</h2>
			</header>
			<section>
				<p>
					About
				</p>
			</section>
			<footer>
				<span class="flex gap-2 text-gray-600">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
						viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round"
						class="lucide lucide-calendar-icon lucide-calendar">
						<path d="M8 2v4" />
						<path d="M16 2v4" />
						<rect width="18" height="18" x="3" y="4" rx="2" />
						<path d="M3 10h18" />
					</svg>
					<span>Создан {{ .User.CreatedAt.Format "01.02.2006" }}</span>
				</span>
			</footer>
		</div>

		<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
			<div class="card">
				<header>
					<div class="rounded-full bg-rose-400 p-2 text-rose-500">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
							viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
							class="lucide lucide-briefcase-business-icon lucide-briefcase-business">
							<path d="M12 12h.01" />
							<path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
							<path d="M22 13a18.15 18.15 0 0 1-20 0" />
							<rect width="20" height="14" x="2" y="6" rx="2" />
						</svg>
					</div>
				</header>
				<section>
					<span class="font-bold">
						{{ .Products | len }}
					</span>
				</section>
				<footer>
					<p class="text-gray-500">
						Продукты
					</p>
				</footer>
			</div>
		</div>
	</div>

</body>

</html>
