{{ define "product-card" }}

<a href="/products/u/{{ .ID }}" class="block h-full group">
  <div
    class="bg-white rounded-2xl border border-gray-200 overflow-hidden transition-shadow group-hover:shadow-sm h-full flex flex-col"
  >
    <div class="flex items-start gap-4 p-4 flex-1">
      <img
        src="{{ if .ImageURL }}{{ .ImageURL }}{{ else }}https://placehold.co/160x160/e0e7ff/4338ca?text={{ .Name }}{{ end }}"
        alt="{{ .Name }}"
        class="w-16 h-16 rounded-lg object-cover ring-1 ring-gray-200"
      />
      <div class="flex-1 min-w-0">
        <h3 class="font-semibold text-gray-900 truncate">{{ .Name }}</h3>
        {{ if .Tagline }}
        <p class="text-sm text-gray-600 line-clamp-2">{{ .Tagline }}</p>
        {{ end }}
        <div class="mt-2 flex flex-wrap gap-1">
          {{ range .Categories }}
          <span class="text-xs bg-gray-100 text-gray-600 rounded px-2 py-0.5"
            >{{ .Name }}</span
          >
          {{ end }}
        </div>
      </div>
    </div>
    <div class="px-4 pb-4 mt-auto text-xs text-gray-500">
      {{ .CreatedAt.Format "02.01.2006" }}
    </div>
  </div>
</a>

{{ end }}
