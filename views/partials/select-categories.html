{{ define "select-categories" }}

<select
  id="select-categories"
  name="categories"
  multiple
  placeholder="Выберите категорию..."
  autocomplete="off"
>
  <option value="">Выберите категорию...</option>
  {{ range .Categories }}
  <option value="{{ .Slug }}">{{ .Name }}</option>
  {{ end }}
</select>

{{ end }}
