{{ define "launch-card" }}

<div class="bg-white rounded-md flex items-start gap-4 border border-gray-200 p-4">
	<img src="https://avatar.iran.liara.run/public" alt="{{ .Name }}"
		class="w-20 h-20 rounded-lg object-cover">

	<div class="flex-grow">
		<div class="flex justify-between items-start">
			<div class="flex items-center gap-4">
				<h3 class="font-bold text-lg text-gray-900">
					{{ .Name }}
				</h3>
				<a href="/products/u/{{ .ProductID }}" target="_blank"
					class="text-gray-400 hover:text-gray-700">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
						viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
						<polyline points="15 3 21 3 21 9" />
						<line x1="10" x2="21" y1="14" y2="3" />
					</svg>
				</a>
			</div>
		</div>

		<p class="text-gray-800 my-2">{{ .Tagline }}</p>
		<p class="text-sm text-gray-600">{{ .Description }}</p>

		<div class="flex flex-wrap items-center gap-4 mt-3">
			<div class="flex items-center gap-2">
				{{ range .Tags }}
				<span class="text-xs font-medium text-gray-600 bg-gray-100 py-1 px-2.5 rounded-full">{{
					.Name }}</span>
				{{ end }}
			</div>
		</div>
	</div>

	<div class="flex-shrink-0 flex flex-col items-center gap-2">
		<button class="border border-gray-200 rounded-md p-2 w-16 text-center hover:bg-gray-50">
			<svg class="w-4 h-4 mx-auto text-gray-500" xmlns="http://www.w3.org/2000/svg" width="24"
				height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
				stroke-linecap="round" stroke-linejoin="round">
				<path d="m5 15 7-7 7 7" />
			</svg>
			<span class="font-bold text-sm text-gray-800">{{ .Upvotes
				}}</span>
		</button>
	</div>

</div>

{{ end }}
