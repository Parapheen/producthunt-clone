{{ define "promotion-result" }}
<div id="promotion-cta" class="rounded-xl border border-gray-200 bg-white p-5">
  <h3 class="text-lg font-semibold text-gray-900">{{ .Title }}</h3>
  <p class="text-gray-600 mt-1">{{ .Message }}</p>
  {{ if .RequireLogin }}
  <div class="mt-4">
    <button
      class="btn rounded-full bg-indigo-600 text-white"
      hx-get="/api/login"
      hx-target="body"
      hx-swap="beforeend"
      type="button"
    >
      Войти
    </button>
  </div>
  {{ end }} {{ if .Support }}
  <p class="mt-3 text-sm text-gray-500">
    Есть вопросы?
    <a
      class="text-indigo-600 hover:underline"
      href="https://t.me/evpetrovich"
      target="_blank"
      rel="noopener"
      >Напишите в Telegram</a
    >
  </p>
  {{ end }} {{ if .ShowBack }}
  <div class="mt-4">
    <a
      href="/promoting"
      class="inline-flex items-center text-sm text-gray-700 hover:underline"
      >Назад</a
    >
  </div>
  {{ end }}
</div>
{{ end }}
