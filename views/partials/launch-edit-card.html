{{ define "launch-edit-card" }}

<div class="bg-white rounded-md flex items-start gap-4 border border-gray-200 p-4">
	<img src="https://avatar.iran.liara.run/public" alt="{{ .Name }}" class="w-20 h-20 rounded-lg object-cover">

	<div class="flex-grow">
		<div class="flex items-center gap-4">
			<h3 class="font-bold text-lg text-gray-900">
				{{ .Name }}
			</h3>
		</div>

		<p class="text-gray-800 my-2">
			{{ template "launch-state" . }}
		</p>
		<p class="text-sm text-gray-600">Последнее обновление: {{ .UpdatedAt.Format "02.01.2006" }}</p>
	</div>

	<div class="flex-shrink-0 flex items-center gap-2">
		<a class="border border-gray-200 rounded-md p-2 w-16 flex items-center justify-center hover:bg-gray-50 hover:text-gray-900"
			href="/products/{{ .ProductID }}/launches/{{ .Slug }}/edit">
			<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
				stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
				class="lucide lucide-pencil-icon lucide-pencil">
				<path
					d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
				<path d="m15 5 4 4" />
			</svg>
		</a>
		<form hx-get="/api/launches/{{ .ID }}">
			<button class="border border-gray-200 rounded-md p-2 w-16 flex items-center justify-center hover:bg-gray-100 hover:text-gray-900"
				type="submit"
			>
				<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
					fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
					stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash">
					<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
					<path d="M3 6h18" />
					<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
				</svg>
			</button>
		</form>
	</div>
</div>

{{ end }}
