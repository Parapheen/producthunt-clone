{{ define "launch-upvote" }} {{ $l := .Launch }}
<div id="upvote-{{ $l.ID }}">
  <form
    hx-post="/api/launches/{{ $l.ID }}/upvote"
    hx-target="#upvote-{{ $l.ID }}"
    hx-swap="outerHTML"
    hx-headers='{"X-CSRF-Token": "{{ $.token }}"}'
    class="inline"
  >
    <button
      type="submit"
      class="{{ if $.Upvoted }}border-2 border-indigo-600 bg-indigo-50 text-indigo-700 hover:bg-indigo-100{{ else }}border border-gray-200 bg-white text-gray-900 hover:bg-gray-50{{ end }} rounded-md px-3 py-2"
      onclick="event.stopPropagation()"
    >
      <span class="text-sm font-semibold">▲ {{ $l.Upvotes }}</span>
    </button>
  </form>
</div>
{{ end }}
