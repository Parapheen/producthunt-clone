{{ define "launch-upvote" }} {{ $l := .Launch }}
<div id="upvote-{{ $l.ID }}">
  <form
    hx-post="/api/launches/{{ $l.ID }}/upvote"
    hx-target="#upvote-{{ $l.ID }}"
    hx-swap="outerHTML"
    hx-headers='{"X-CSRF-Token": "{{ $.token }}"}'
    class="inline"
  >
    {{ if $.WithText }}
    <input type="hidden" name="withText" value="true" />
    {{ end }}
    <button
      type="submit"
      class="{{ if $.Upvoted }}border-2 border-indigo-600 bg-indigo-50 text-indigo-700 hover:bg-indigo-100{{ else }}border border-gray-200 bg-white text-gray-900 hover:bg-gray-50{{ end }} rounded-md px-3 h-9 inline-flex items-center"
      onclick="event.stopPropagation()"
    >
      <span class="text-sm font-semibold">
        {{ if $.Upvoted }}
        <i class="bi bi-caret-up-fill"></i>
        {{ if $.WithText }}
        <span class="ml-1">Вы поддержали</span>
        {{ end }} {{ else }}
        <i class="bi bi-caret-up"></i>
        {{ if $.WithText }}
        <span class="ml-1">Поддержать</span>
        {{ end }} {{ end }} {{ if $.WithText }}
        <span class="ml-1">|</span>
        {{ end }}
        <span class="ml-1">{{ $l.Upvotes }}</span>
      </span>
    </button>
  </form>
</div>
{{ end }}
