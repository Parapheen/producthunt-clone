{{ define "content" }}
<section class="container max-w-3xl mx-auto">
  <div class="mb-4">
    <a
      href="/admin/moderation/launches"
      class="text-sm text-gray-500 hover:underline"
      >← К модерации</a
    >
  </div>
  <h1 class="text-2xl font-bold mb-4">Награды для запуска</h1>
  <div class="bg-white border rounded-lg p-4 mb-6">
    <div class="flex items-start gap-3">
      <img
        src="{{ if .Launch.ImageURL }}{{ .Launch.ImageURL }}{{ else }}https://placehold.co/80x80/e0e7ff/4338ca?text={{ .Launch.Name }}{{ end }}"
        class="w-16 h-16 rounded-md object-cover"
        alt="{{ .Launch.Name }}"
      />
      <div>
        <div class="font-semibold">{{ .Launch.Name }}</div>
        {{ if .Launch.Tagline }}
        <div class="text-sm text-gray-600">{{ .Launch.Tagline }}</div>
        {{ end }}
      </div>
    </div>
  </div>

  <div class="bg-white border rounded-lg p-4 mb-6">
    <div class="text-sm font-semibold mb-2">Назначить награду</div>
    <form
      class="flex flex-col sm:flex-row gap-2 items-start sm:items-end"
      hx-post="/api/launches/{{ .Launch.ID }}/awards"
      hx-headers='{"X-CSRF-Token": "{{ $.token }}"}'
    >
      <div>
        <label class="block text-xs text-gray-600 mb-1">Награда</label>
        <select name="award_code" class="border rounded-md px-2 py-1">
          {{ range .Awards }}
          <option value="{{ .Code }}">{{ .Name }}</option>
          {{ end }}
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1"
          >Период (YYYY-MM-DD)</label
        >
        <input
          type="date"
          name="period_date"
          class="border rounded-md px-2 py-1"
        />
      </div>
      <div>
        <button class="px-3 py-1 border rounded-md bg-gray-50" type="submit">
          Назначить
        </button>
      </div>
    </form>
  </div>

  <div class="bg-white border rounded-lg p-4">
    <div class="text-sm font-semibold mb-2">Уже присвоенные награды</div>
    <div class="flex flex-wrap gap-2">
      {{ range .Existing }}
      <span
        class="inline-flex items-center gap-1 text-xs bg-amber-100 text-amber-800 rounded-full px-2.5 py-1"
        title="{{ .Award.Name }} ({{ .PeriodDate }})"
      >
        <span>{{ .Award.Icon }}</span>
        <span>{{ .Award.Name }}</span>
      </span>
      {{ else }}
      <div class="text-sm text-gray-500">Наград пока нет.</div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
