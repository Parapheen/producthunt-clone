{{ define "content" }}
<section class="container max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">Блог</h1>
  <div class="space-y-8">
    {{ range .Posts }}
    <article class="group border-b border-gray-200 pb-6">
      <header>
        <a href="/blog/{{ .Slug }}" class="no-underline">
          <h2 class="text-2xl font-semibold text-gray-900 group-hover:underline">
            {{ .Title }}
          </h2>
        </a>
        <div class="mt-2 text-sm text-gray-500 flex items-center gap-2">
          <time datetime="{{ .CreatedAt.Format "2006-01-02" }}">
            {{ .CreatedAt.Format "02.01.2006" }}
          </time>
          <span>•</span>
          <span>{{ .ReadingTime }} мин на чтение</span>
        </div>
      </header>
      {{ if .Excerpt }}
      <p class="mt-3 text-gray-700">
        {{ .Excerpt }}
      </p>
      {{ end }}
      <footer class="mt-3">
        <a href="/blogs/{{ .Slug }}" class="text-indigo-600 hover:text-indigo-800 font-medium"
          >Читать →</a
        >
      </footer>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
